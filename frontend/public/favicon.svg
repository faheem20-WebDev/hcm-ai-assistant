<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="favHelm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="favEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="60%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </radialGradient>
  </defs>
  
  <!-- Antenna -->
  <line x1="16" y1="7" x2="16" y2="2" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="16" cy="2" r="2" fill="#06B6D4"/>
  <circle cx="16" cy="2" r="0.8" fill="#FFFFFF"/>

  <!-- Ears -->
  <rect x="3" y="12" width="2" height="6" rx="1" fill="#06B6D4"/>
  <rect x="27" y="12" width="2" height="6" rx="1" fill="#06B6D4"/>

  <!-- Head Shell -->
  <rect x="5" y="7" width="22" height="18" rx="8" fill="url(#favHelm)" stroke="#6366F1" stroke-width="1.2"/>

  <!-- Visor -->
  <rect x="7" y="10" width="18" height="12" rx="5" fill="#090D16" stroke="#1E293B" stroke-width="0.8"/>

  <!-- Cyan Eyes -->
  <rect x="10" y="13" width="3.5" height="4.5" rx="1.75" fill="url(#favEye)"/>
  <circle cx="11.5" cy="14.5" r="0.75" fill="#FFFFFF"/>
  <rect x="18.5" y="13" width="3.5" height="4.5" rx="1.75" fill="url(#favEye)"/>
  <circle cx="20" cy="14.5" r="0.75" fill="#FFFFFF"/>

  <!-- Smile -->
  <path d="M 14 19 Q 16 20.5 18 19" stroke="#06B6D4" stroke-width="1" stroke-linecap="round" fill="none"/>

  <!-- Thruster Base Ring -->
  <path d="M 10 26 Q 16 27.5 22 26" stroke="#06B6D4" stroke-width="1.2" stroke-linecap="round" fill="none"/>
</svg>
